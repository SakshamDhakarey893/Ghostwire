name: Build Standalone Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ghostwire-linux-x64
            asset_name: ghostwire-linux-x64
          - os: windows-latest
            artifact_name: ghostwire-windows-x64.exe
            asset_name: ghostwire-windows-x64.exe
          - os: macos-latest
            artifact_name: ghostwire-macos-x64
            asset_name: ghostwire-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name ghostwire-windows-x64 ghostwire.py
          Move-Item -Path dist/ghostwire-windows-x64.exe -Destination dist/ghostwire-windows-x64.exe

      - name: Build standalone executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name ${{ matrix.asset_name }} ghostwire.py
          chmod +x dist/${{ matrix.asset_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Attach Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
